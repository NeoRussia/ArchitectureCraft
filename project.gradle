// See https://github.com/elytra/Skeleton/wiki for what all these values mean

ext {
    group = 'com.elytradev'
    projectName = 'architecturecraft'

    useElytraVersionFormat = false
    // What the mod reports to Forge and in mcmod.info. Keep MOD_VER in
    // ArchitectureMod.java in step with it; the download name comes from
    // `releaseName` below.
    version = '3.108-0.4'

    // Name of the released jar, without the extension or the classifier.
    // Kept apart from `version`, which is what the mod reports to Forge and in
    // mcmod.info: renaming the download must not change what the mod calls
    // itself.
    releaseName = 'architecturecraft-renovated.3.108-0.4'

    concreteVersion = '0.3.3-SNAPSHOT'
    concreteModules = ['all']

    coremod = null
    miniVersion = null

    language = 'java'

    forge = '1.12.2-14.23.4.2747'
    mappings = 'snapshot_20180814'

    enforceLicenseHeaders = false

    verbose = false
}

if (!ext.early) {
    repositories {
        // the skeleton already defines mavenCentral, jcenter, and the Elytra repo
        // will also have Shadowfacts' maven if the language is set to kotlin
        maven {
            // location of the maven that hosts JEI files
            name = "Progwml6 maven"
            url = "http://dvs1.progwml6.com/files/maven"
        }
        maven {
            // location of a maven mirror for JEI files, as a fallback
            name = "ModMaven"
            url = "modmaven.k-4u.nl"
        }
        maven {
            // for Architect API
            name = "Architect maven"
            url = "http://maven.cil.li/"
        }
    }

    dependencies {
        deobfProvided "mezz.jei:jei_1.12.2:4.7.10.98:api"
        runtime "mezz.jei:jei_1.12.2:4.7.10.98"
        compile "li.cil.architect:Architect:MC1.12-1.2.0.6"
    }
}
